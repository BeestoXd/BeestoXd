name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download stats.svg
        run: |
          mkdir -p dist
          curl -fsSL "https://github-readme-stats-one-bice.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=dark&hide_border=false&include_all_commits=true&locale=en" -o dist/stats.svg

      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
